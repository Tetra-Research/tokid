name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate
        run: npm run release:check

      - name: Ensure git tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/js/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          test "$PACKAGE_VERSION" = "$TAG_VERSION"

          EXPECTED_PYTHON_VERSION=$(node - <<'NODE'
          const version = require("./packages/js/package.json").version;
          const match = version.match(/^(\d+\.\d+\.\d+)-alpha\.(\d+)$/);
          if (!match) {
            throw new Error(`Unsupported JS release version: ${version}`);
          }
          process.stdout.write(`${match[1]}a${match[2]}`);
          NODE
          )

          PYTHON_VERSION=$(python3 - <<'PY'
          import pathlib
          import re

          match = re.search(
              r'^version = "([^"]+)"$',
              pathlib.Path("packages/python/pyproject.toml").read_text(),
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit("Could not read Python package version")
          print(match.group(1))
          PY
          )

          test "$PYTHON_VERSION" = "$EXPECTED_PYTHON_VERSION"

  publish-npm:
    name: Publish npm package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build package artifacts
        run: npm run build:package

      - name: Publish to npm
        run: npm run release:npm -- --skip-check

  publish-pypi:
    name: Publish PyPI package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build distributions
        working-directory: packages/python
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
