[package]
name = "tokid"
version = "0.1.0-alpha.2"
edition = "2021"
description = "Token-native IDs for LLM-facing systems"
license = "ISC"
readme = "README.md"
repository = "https://github.com/Tetra-Research/tokid"
homepage = "https://github.com/Tetra-Research/tokid/tree/main/packages/rust#readme"
documentation = "https://github.com/Tetra-Research/tokid/tree/main/packages/rust#readme"
keywords = ["tokenizer", "identifiers", "llm", "tokid"]
categories = ["encoding", "parser-implementations", "text-processing"]
include = ["src/**/*.rs", "generated/**/*.json", "Cargo.toml", "README.md"]

[dependencies]
hex = "0.4"
num-bigint = "0.4"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
